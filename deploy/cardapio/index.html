<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardápio · Maanaim Cantina</title>
    <meta name="description" content="O que a Cantina Maanaim tem hoje, com preço e quantidade disponível." />
    <meta name="theme-color" content="#16150f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Página de vitrine, escrita à mão de propósito: é uma tela só, lida no
      celular de quem está na fila, e não vale carregar um framework inteiro
      para mostrar uma lista. Sem build, sem dependência -- o Caddy serve este
      arquivo e ele busca os dados na própria origem.
    -->
    <style>
      :root {
        --fundo: #16150f;
        --cartao: #211f1b;
        --linha: #302d26;
        --tinta: #f2efe9;
        --suave: #b6b1a7;
        --fraco: #8b877e;
        --marca: #fb9b38;
        --esgotado: #f16a6a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --fundo: #f7f7f6;
          --cartao: #ffffff;
          --linha: #e5e4e1;
          --tinta: #1d1c1a;
          --suave: #56534d;
          --fraco: #8d8a83;
          --marca: #c24909;
          --esgotado: #dc2626;
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--fundo);
        color: var(--tinta);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      header {
        padding: 28px 20px 20px;
        text-align: center;
        border-bottom: 1px solid var(--linha);
      }
      header img { width: min(240px, 68vw); height: auto; }
      header p { margin: 10px 0 0; color: var(--fraco); font-size: 14px; }

      main { max-width: 900px; margin: 0 auto; padding: 8px 16px 64px; }

      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--marca);
        margin: 28px 0 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--linha);
      }

      .itens { display: grid; gap: 10px; }
      /* Duas colunas em computador -- inclusive no celular que pediu "site
         para computador", que e o pedido de quem quer a versao cheia. No
         celular, uma coluna: cartao largo se le com o polegar. */
      html[data-dispositivo="computador"] .itens {
        grid-template-columns: repeat(2, 1fr);
      }
      @media (max-width: 560px) {
        html[data-dispositivo="computador"] .itens { grid-template-columns: 1fr; }
      }

      .item {
        display: flex;
        gap: 12px;
        align-items: center;
        background: var(--cartao);
        border: 1px solid var(--linha);
        border-radius: 14px;
        padding: 10px;
      }
      .item.sem { opacity: 0.55; }

      .foto {
        width: 76px;
        height: 76px;
        flex: none;
        border-radius: 10px;
        object-fit: cover;
        background: var(--linha);
      }
      .foto.vazia {
        display: grid;
        place-items: center;
        color: var(--fraco);
        font-size: 24px;
      }

      .corpo { min-width: 0; flex: 1; }
      .nome { font-weight: 600; line-height: 1.25; }
      .descricao {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--suave);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .rodape-item {
        margin-top: 6px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .preco { font-size: 19px; font-weight: 700; color: var(--marca); }
      .restam { font-size: 12px; color: var(--fraco); }
      .esgotado {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--esgotado);
      }
      .poucos { color: var(--esgotado); font-weight: 600; }

      .aviso {
        text-align: center;
        color: var(--fraco);
        padding: 48px 20px;
      }

      footer {
        text-align: center;
        color: var(--fraco);
        font-size: 13px;
        padding: 24px 20px 40px;
        margin-top: 24px;
      }
      footer p { margin: 6px 0; }
      /* Aviso de direitos: presente, sem disputar atenção com o cardápio. */
      .direitos { font-size: 11px; opacity: 0.55; }
    </style>
  </head>

  <body>
    <header>
      <img src="/logo-cantina.png" alt="Maanaim Cantina" id="marca" />
      <p id="atualizado">Carregando o cardápio…</p>
    </header>

    <main id="cardapio">
      <p class="aviso">Um instante…</p>
    </main>

    <footer>
      <p>Os preços e as quantidades vêm direto do balcão.</p>
      <p class="direitos">© 2026 Maanaim Cantina · Feito por Levi M.</p>
    </footer>

    <script>
      // Aparelho, e nao largura: o navegador diz se e celular, e a resposta
      // muda quando o usuario pede "site para computador".
      (function () {
        const ua = navigator.userAgentData;
        const movel =
          ua && typeof ua.mobile === "boolean"
            ? ua.mobile
            : /Mobi|Android|iPhone|iPod|Windows Phone/i.test(navigator.userAgent);
        document.documentElement.dataset.dispositivo = movel ? "movel" : "computador";
      })();

      const real = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
      const alvo = document.getElementById("cardapio");
      const atualizado = document.getElementById("atualizado");

      // A logo branca da marca só serve no escuro; no claro usa a versão escura.
      const claro = window.matchMedia("(prefers-color-scheme: light)");
      const trocarMarca = () => {
        document.getElementById("marca").src = claro.matches
          ? "/logo-cantina-escuro.png"
          : "/logo-cantina.png";
      };
      trocarMarca();
      claro.addEventListener("change", trocarMarca);

      /** Cria um elemento com texto -- nunca com HTML, que é o que evita injeção. */
      function elemento(tag, classe, texto) {
        const el = document.createElement(tag);
        if (classe) el.className = classe;
        if (texto !== undefined) el.textContent = texto;
        return el;
      }

      function cartao(item) {
        const linha = elemento("article", "item" + (item.esgotado ? " sem" : ""));

        if (item.tem_foto) {
          const img = elemento("img", "foto");
          img.src = `/api/publico/produtos/${item.id}/foto`;
          img.alt = item.nome;
          img.loading = "lazy";
          linha.append(img);
        } else {
          linha.append(elemento("div", "foto vazia", "🍽"));
        }

        const corpo = elemento("div", "corpo");
        corpo.append(elemento("p", "nome", item.nome));
        if (item.descricao) corpo.append(elemento("p", "descricao", item.descricao));

        const rodape = elemento("div", "rodape-item");
        rodape.append(elemento("span", "preco", real.format(Number(item.preco))));

        if (item.esgotado) {
          rodape.append(elemento("span", "esgotado", "Esgotado"));
        } else {
          const poucos = item.disponivel <= 3;
          const unidade = item.disponivel === 1 ? "unidade" : "unidades";
          rodape.append(
            elemento("span", "restam" + (poucos ? " poucos" : ""), `${item.disponivel} ${unidade}`)
          );
        }

        corpo.append(rodape);
        linha.append(corpo);
        return linha;
      }

      function desenhar(dados) {
        const porCategoria = new Map();
        for (const item of dados.itens) {
          const chave = item.categoria || "Outros";
          if (!porCategoria.has(chave)) porCategoria.set(chave, []);
          porCategoria.get(chave).push(item);
        }

        alvo.replaceChildren();
        if (!porCategoria.size) {
          alvo.append(elemento("p", "aviso", "O cardápio de hoje ainda não foi montado."));
          return;
        }

        // Quem tem item disponível aparece antes: ninguém quer rolar uma tela
        // de esgotados para achar o que dá para comprar.
        const categorias = [...porCategoria.entries()].sort((a, b) => {
          const disponiveis = (lista) => lista.filter((i) => !i.esgotado).length;
          return disponiveis(b[1]) - disponiveis(a[1]) || a[0].localeCompare(b[0], "pt-BR");
        });

        for (const [categoria, itens] of categorias) {
          alvo.append(elemento("h2", null, categoria));
          const grade = elemento("div", "itens");
          itens
            .sort((a, b) => a.esgotado - b.esgotado || a.nome.localeCompare(b.nome, "pt-BR"))
            .forEach((item) => grade.append(cartao(item)));
          alvo.append(grade);
        }

        const agora = new Date().toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
        });
        atualizado.textContent = `Atualizado às ${agora}`;
      }

      async function buscar() {
        try {
          const resposta = await fetch("/api/publico/cardapio", { cache: "no-store" });
          if (!resposta.ok) throw new Error(resposta.status);
          desenhar(await resposta.json());
        } catch {
          alvo.replaceChildren(
            elemento("p", "aviso", "Não consegui carregar o cardápio agora. Tente daqui a pouco.")
          );
          atualizado.textContent = "";
        }
      }

      buscar();
      // Volta a olhar quando a pessoa retoma a aba: o estoque muda o dia todo.
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") buscar();
      });
    </script>
  </body>
</html>
