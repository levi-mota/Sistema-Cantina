<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1d1c1a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maanaim Cantina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Antes da primeira pintura: sem isto a tela pisca clara e so depois
      // escurece, a cada carregamento.
      try {
        var salvo = localStorage.getItem("cantina:tema");
        var tema =
          salvo === "claro" || salvo === "escuro"
            ? salvo
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "escuro"
              : "claro";
        document.documentElement.dataset.tema = tema;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
